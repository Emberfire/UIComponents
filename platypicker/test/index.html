<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Platypicker</title>
    <link rel="icon" type="image/x-icon" href="../platylogo.ico">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body class="py-5 container">
<section class="row g-2">
    <div class="col">
        <div class="card" style="resize: horizontal; overflow: auto;">
            <div class="card-body">
                <h3 class="card-title">Native select</h3>
                <label class="form-label" for="select">Pick a food</label>
                <select id="select" class="form-select" name="select">
                    <button>
                        <selectedcontent></selectedcontent>
                    </button>
                    <option>Cheese 🧀</option>
                    <option>Bread 🍞</option>
                    <hr>
                    <option disabled>Coffee ☕ (disabled)</option>
                    <option>Tea 🍵</option>
                    <optgroup label="Fruits (disabled)" disabled>
                        <option value="1">Apple 🍎</option>
                        <option value="2">Orange 🍊</option>
                        <option value="3">Mango 🥭</option>
                    </optgroup>
                    <optgroup label="Vegetables">
                        <option value="4">Cucumber 🥒</option>
                        <option value="5">Tomato 🍅</option>
                        <option value="6">Broccoli 🥦</option>
                    </optgroup>
                    <hr>
                    <option>Carrot 🥕</option>
                </select>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card" style="resize: horizontal; overflow: auto;">
            <div class="card-body">
                <h3 class="card-title">Native multi-select</h3>
                <label class="form-label" for="multi-select">Pick a food</label>
                <select id="multi-select" class="form-select" name="multi-select" multiple size="1">
                    <button>
                        <selectedcontent></selectedcontent>
                    </button>
                    <option>Cheese 🧀</option>
                    <option>Bread 🍞</option>
                    <hr>
                    <option disabled>Coffee ☕ (disabled)</option>
                    <option>Tea 🍵</option>
                    <optgroup label="Fruits (disabled)" disabled>
                        <option value="1">Apple 🍎</option>
                        <option value="2">Orange 🍊</option>
                        <option value="3">Mango 🥭</option>
                    </optgroup>
                    <optgroup label="Vegetables">
                        <option value="4">Cucumber 🥒</option>
                        <option value="5">Tomato 🍅</option>
                        <option value="6">Broccoli 🥦</option>
                    </optgroup>
                    <hr>
                    <option>Carrot 🥕</option>
                </select>
            </div>
        </div>
    </div>
</section>
<section class="row g-2 mt-2">
    <div class="col">
        <div class="card" style="resize: horizontal; overflow: auto;">
            <div class="card-body">
                <h3 class="card-title"><img height="30" src="../platylogo.png" alt="Platypicker"> Platypicker</h3>
                <label class="form-label" for="platypicker">Pick a food</label>
                <select id="platypicker" class="form-select" name="platypicker" data-toggle="platypicker" data-search="true" data-controls="true">
                    <button>
                        <selectedcontent></selectedcontent>
                    </button>
                    <option>Cheese 🧀</option>
                    <option>Bread 🍞</option>
                    <hr>
                    <option disabled data-subtext="disabled">Coffee ☕</option>
                    <option>Tea 🍵</option>
                    <optgroup label="Fruits" disabled data-subtext="disabled">
                        <option value="1">Apple 🍎</option>
                        <option value="2">Orange 🍊</option>
                        <option value="3">Mango 🥭</option>
                    </optgroup>
                    <optgroup label="Vegetables">
                        <option value="4">Cucumber 🥒</option>
                        <option value="5">Tomato 🍅</option>
                        <option value="6">Broccoli 🥦</option>
                    </optgroup>
                    <option>Carrot 🥕</option>
                </select>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card" style="resize: horizontal; overflow: auto;">
            <div class="card-body">
                <h3 class="card-title"><img height="30" src="../platylogo.png" alt="Platypicker"> Multi-platypicker</h3>
                <label class="form-label" for="multi-platypicker">Pick a food</label>
                <select id="multi-platypicker" class="form-select" name="multi-platypicker" multiple size="1" data-toggle="platypicker" data-search="true" data-controls="true">
                    <button>
                        <selectedcontent></selectedcontent>
                    </button>
                    <option>Cheese 🧀</option>
                    <option>Bread 🍞</option>
                    <hr>
                    <option disabled>Coffee ☕ (disabled)</option>
                    <option>Tea 🍵</option>
                    <optgroup label="Fruits (disabled)" disabled>
                        <option value="1">Apple 🍎</option>
                        <option value="2">Orange 🍊</option>
                        <option value="3">Mango 🥭</option>
                    </optgroup>
                    <optgroup label="Vegetables">
                        <option value="4">Cucumber 🥒</option>
                        <option value="5">Tomato 🍅</option>
                        <option value="6">Broccoli 🥦</option>
                    </optgroup>
                    <option>Carrot 🥕</option>
                </select>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../dist/platypicker.min.js"></script>
</body>
</html>
