<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select test</title>
    <link rel="stylesheet" href="../src/atmosSelect.css">
    <link rel="stylesheet" href="./index.css">
    <script type="importmap"> { "imports": { "redom": "https://cdnjs.cloudflare.com/ajax/libs/redom/3.17.0/redom.es.min.js" } }</script>
</head>
<body>
<label>
    Atmos select
    <span class="wrapper">
        <select data-toggle="select" data-placeholder="None selected" data-show-values-as-subtext="true" data-live-search="true">
            <!-- Options without a value attribute but with text -->
            <option>Banana</option>
            <!-- Options with a value attribute and no text -->
            <option value="apple-1"></option>
            <!-- Options with both value attribute and text -->
            <option data-subtext="Sweet carrot" value="carrot-3">Carrot</option>
            <!-- Options with no value attribute and no text -->
            <option data-subtext="No carrot"></option>
            <!-- Disabled options -->
            <option disabled>Tangerine</option>
            <!-- Options inside optgroups -->
            <optgroup label="Fruits">
                <option>Strawberry</option>
                <option value="kiwi">Kiwi</option>
            </optgroup>
        </select>
    </span>
</label>
<script type="module" src="../dist/atmosSelect.js"></script>
</body>
</html>
