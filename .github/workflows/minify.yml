name: Auto Minify

on:
  push:
    paths:
      - "**/src/**/*.js"
      - "**/src/**/*.css"
  workflow_dispatch:

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install minifiers
        run: |
          npm install -g terser lightningcss-cli

      - name: Find all src folders and minify
        run: |
          set -e
          # Find all src directories
          find . -type d -name src | while read srcdir; do
            basedir=$(dirname "$srcdir")
            distdir="$basedir/dist"

            echo "Minifying $srcdir -> $distdir"

            # Find all JS files recursively in src
            find "$srcdir" -type f -name "*.js" ! -name "*.min.js" | while read jsfile; do
              relpath="${jsfile#$srcdir/}"            # relative path inside src
              outpath="$distdir/${relpath%.js}.min.js"
              mkdir -p "$(dirname "$outpath")"
              terser "$jsfile" --compress --mangle --output "$outpath"
            done

            # Find all CSS files recursively in src
            find "$srcdir" -type f -name "*.css" ! -name "*.min.css" | while read cssfile; do
              relpath="${cssfile#$srcdir/}"           # relative path inside src
              outpath="$distdir/${relpath%.css}.min.css"
              mkdir -p "$(dirname "$outpath")"
              lightningcss "$cssfile" --minify --output-file "$outpath"
            done
          done

      - name: Commit minified files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add . || echo "No changes to add"
          git commit -m "Auto-minify JS and CSS" || echo "No changes to commit"
          git push
