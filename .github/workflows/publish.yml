name: Publish platypicker to npm

on:
  release:
    types: [published, prereleased, created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver, without leading v)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: platypicker
        run: npm ci

      - name: Build package if necessary
        working-directory: platypicker
        run: npm run build --if-present

      - name: Run package tests
        working-directory: platypicker
        run: npm test --if-present

      - name: Set version from release tag or manual input
        working-directory: platypicker
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF_NAME#v}
          fi
      
          npm version "$VERSION" --no-git-tag-version

      - name: Publish to GitHub npm registry
        working-directory: platypicker
        run: npm publish
