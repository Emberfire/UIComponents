name: Publish platypicker to npm

on:
  workflow_run:
    workflows: ["Create Release From Version Tag"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver, without leading v)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: platypicker
        run: npm ci

      - name: Build package if necessary
        working-directory: platypicker
        run: npm run build --if-present

      - name: Run package tests
        working-directory: platypicker
        run: npm test --if-present

      - name: Determine version
        working-directory: platypicker
        run: |
          # Manual dispatch input takes priority
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          # workflow_run trigger: use the tag from the triggering workflow
          elif [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
            # head_branch contains 'refs/tags/1.2.3' on tag push triggers
            REF="${{ github.event.workflow_run.head_branch }}"
            VERSION="${REF#refs/tags/}"
          else
            echo "Error: Could not determine version"
            exit 1
          fi

          echo "Using version: $VERSION"
          npm version "$VERSION" --no-git-tag-version

      - name: Publish to GitHub npm registry
        working-directory: platypicker
        run: npm publish
