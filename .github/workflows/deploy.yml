# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  release:
    types: [published, prereleased, created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver, without leading v)"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare deployment artifacts
        run: |
          rm -rf deploy
          mkdir deploy

          # Loop through all first-level folders
          for folder in */ ; do
            folder=${folder%/}
            echo "Processing $folder"

            # Check if folder has package.json
            if [ -f "$folder/package.json" ]; then
              cd "$folder"

              # Install dependencies
              if [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi

              # Run build script if it exists
              if npm run | grep -q 'build'; then
                echo "Running build for $folder"
                npm run build --if-present
              else
                echo "No build script for $folder, skipping build"
              fi

              cd ..
            fi

            # Copy folder to deploy if dist exists
            if [ -d "$folder/dist" ] && [ -d "$folder/test" ]; then
              echo "Adding $folder to deployment"
              cp -r "$folder" "deploy/$folder"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
